<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)"/>

  <!-- Agency: Connected agent network symbol -->
  <!-- Central node (larger) -->
  <circle cx="64" cy="64" r="14" fill="white" opacity="0.95"/>

  <!-- Outer nodes -->
  <circle cx="64" cy="24" r="10" fill="white" opacity="0.9"/>
  <circle cx="96" cy="80" r="10" fill="white" opacity="0.9"/>
  <circle cx="32" cy="80" r="10" fill="white" opacity="0.9"/>

  <!-- Connecting lines -->
  <line x1="64" y1="34" x2="64" y2="50" stroke="white" stroke-width="3" opacity="0.8"/>
  <line x1="73" y1="70" x2="86" y2="77" stroke="white" stroke-width="3" opacity="0.8"/>
  <line x1="55" y1="70" x2="42" y2="77" stroke="white" stroke-width="3" opacity="0.8"/>

  <!-- Add subtle inner glow to central node -->
  <circle cx="64" cy="64" r="14" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
</svg>
