name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout latency dependency
        uses: actions/checkout@v4
        with:
          repository: generacy-ai/latency
          token: ${{ secrets.GITHUB_TOKEN }}
          path: .latency
      - name: Link latency to expected path
        run: sudo mkdir -p /workspaces && sudo ln -s "$GITHUB_WORKSPACE/.latency" /workspaces/latency
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout latency dependency
        uses: actions/checkout@v4
        with:
          repository: generacy-ai/latency
          token: ${{ secrets.GITHUB_TOKEN }}
          path: .latency
      - name: Link latency to expected path
        run: sudo mkdir -p /workspaces && sudo ln -s "$GITHUB_WORKSPACE/.latency" /workspaces/latency
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout latency dependency
        uses: actions/checkout@v4
        with:
          repository: generacy-ai/latency
          token: ${{ secrets.GITHUB_TOKEN }}
          path: .latency
      - name: Link latency to expected path
        run: sudo mkdir -p /workspaces && sudo ln -s "$GITHUB_WORKSPACE/.latency" /workspaces/latency
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout latency dependency
        uses: actions/checkout@v4
        with:
          repository: generacy-ai/latency
          token: ${{ secrets.GITHUB_TOKEN }}
          path: .latency
      - name: Link latency to expected path
        run: sudo mkdir -p /workspaces && sudo ln -s "$GITHUB_WORKSPACE/.latency" /workspaces/latency
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"
