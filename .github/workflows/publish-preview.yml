name: Publish Preview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

concurrency:
  group: publish-preview-${{ github.ref }}
  # No cancel-in-progress — queue to avoid aborting mid-publish

permissions:
  contents: read
  id-token: write

jobs:
  preview:
    name: Preview Publish
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changesets
        id: changesets
        run: |
          CHANGESET_FILES=$(find .changeset -name '*.md' ! -name 'README.md' 2>/dev/null | head -1)
          if [ -z "$CHANGESET_FILES" ]; then
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            echo "No changeset files found, skipping preview publish"
          else
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
            echo "Changeset files found, proceeding with preview publish"
          fi

      - name: Verify latency dependency
        if: steps.changesets.outputs.has_changesets == 'true'
        id: latency
        run: |
          if npm view @generacy-ai/latency@preview version 2>/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "@generacy-ai/latency@preview is available on npm"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::@generacy-ai/latency@preview not found on npm — skipping preview publish"
          fi

      - name: Setup pnpm
        if: steps.changesets.outputs.has_changesets == 'true' && steps.latency.outputs.found == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.changesets.outputs.has_changesets == 'true' && steps.latency.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Update npm
        if: steps.changesets.outputs.has_changesets == 'true' && steps.latency.outputs.found == 'true'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.changesets.outputs.has_changesets == 'true' && steps.latency.outputs.found == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.changesets.outputs.has_changesets == 'true' && steps.latency.outputs.found == 'true'
        run: pnpm build

      - name: Publish preview snapshots
        if: steps.changesets.outputs.has_changesets == 'true' && steps.latency.outputs.found == 'true'
        run: |
          pnpm changeset version --snapshot preview
          pnpm changeset publish --tag preview --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
